name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - run: echo "Build completed"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - run: echo "Tests completed"

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - run: echo "Deploy completed"
